name: VideoChat-FE S3 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Cần thiết nếu dùng AWS IAM Role assume qua OIDC (khuyên dùng)

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # --- 1. CHECKOUT CODE ---
      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1.1. SETUP MÔI TRƯỜNG NODE.JS ---
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --- 1.2. CÀI ĐẶT DEPENDENCIES ---
      - name: Install Dependencies
        run: npm ci

      # --- 1.3. BUILD TEST DỰ ÁN REACT (KIỂM TRA LỖI COMPILE/TYPESCRIPT) ---
      - name: Build React App
        run: npm run build
        # Lưu ý: Thường output folder của Vite là `dist` hoặc Create React App là `build`. 
        # Hãy thay đổi đường dẫn ở các bước sau nếu project của bạn dùng tên khác (ví dụ: ./dist thay vì ./build).

      # --- 2. TÍNH SEMANTIC VERSION ---
      - name: Calculate Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE:|!:)"
          minor_pattern: "^feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      # --- 3. CẤU HÌNH AWS CREDENTIALS ---
      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} # Ví dụ: ap-southeast-1

      # --- 4. SYNC LÊN AMAZON S3 ---
      - name: Deploy to Amazon S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete
          # Thêm cờ --delete để tự động xóa các file cũ không còn tồn tại trong bản build mới

      # --- 5. INVALIDATE CLOUDFRONT CACHE (TÙY CHỌN NHƯNG KHUYÊN DÙNG) ---
      - name: Invalidate CloudFront Cache
        if: github.event_name != 'pull_request' && env.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      # --- 6. BẤM GIT TAG CHO CODE APP FE ---
      - name: Create Git Tag on App Repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.semver.outputs.version }} || exit 0
          git push origin v${{ steps.semver.outputs.version }} || exit 0
